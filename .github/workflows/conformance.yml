name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures-and-runner:
    name: fixtures and runner (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: conformance
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Reject operating-system metadata
        run: |
          if find . \( -name '.DS_Store' -o -name 'Thumbs.db' -o -name 'desktop.ini' \) -print | grep -q .; then
            echo "operating-system metadata must not be shipped"
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test-only dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Verify fixture package integrity and semantics
        run: python tools/verify_vectors.py --expect-status OFFICIAL --expect-package-revision 1.0.0 --expect-spec-revision 1.0.4

      - name: Independent Node.js BigInt oracle
        run: node tools/verify_oracle_node.mjs

      - name: Run validator and runner self-tests
        run: python -m unittest discover -s tools/tests -v

      - name: Reference transport self-test (automated layer only)
        run: python tools/run_adapter.py --automated-only --report-json "$RUNNER_TEMP/conformance-results.json" -- python tools/examples/reference_bridge.py

      - name: Record default-mode audit status
        # Default mode exits 3 while manual audits are outstanding. That is the
        # expected, non-certifying outcome for the reference transport; any
        # other code is a regression.
        run: |
          set +e
          python tools/run_adapter.py --report-json "$RUNNER_TEMP/conformance-audit-required.json" -- python tools/examples/reference_bridge.py
          code=$?
          set -e
          test "$code" -eq 3 || { echo "expected exit 3 (audit required), got $code"; exit 1; }

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-results-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/conformance-results.json
            ${{ runner.temp }}/conformance-audit-required.json
          if-no-files-found: warn
