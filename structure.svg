<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="590" viewBox="0 0 1320 590" role="img" aria-labelledby="title description">
<title id="title">pikaid identifier structure</title>
<desc id="description">A 26-character lowercase Base36 identifier: seven timestamp characters in blue and nineteen randomness characters in green. The binary form is seventeen bytes: five bytes for the timestamp and twelve bytes for randomness.</desc>
